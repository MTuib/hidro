{% extends "core/base.html" %}


{% block title %}Login{% endblock %}


{% block content %}
<h2>Login</h2>
{% if error %}
<p role="alert">{{ error }}</p>
{% endif %}


<form method="post">
{% csrf_token %}


<label>Usuari
<input type="text" name="username" required>
</label><br>


<label>Contrasenya
<input type="password" name="password" required>
</label><br>


<button type="submit">Entrar</button>
</form>
{% endblock %}
